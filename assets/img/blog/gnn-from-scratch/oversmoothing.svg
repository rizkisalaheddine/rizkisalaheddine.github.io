<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Layer-wise oversmoothing diagnostics for GCN and GAT</title>
  <desc id="desc">Two line charts compare pairwise cosine similarity and normalized dispersion over six layers.</desc>
  <defs><style>.bg{fill:#fff;stroke:#d0d7de;stroke-width:1.5}.title{font:600 20px Georgia,serif;fill:#24292f;text-anchor:middle}.label{font:14px Arial,sans-serif;fill:#57606a}.tick{font:12px Arial,sans-serif;fill:#57606a;text-anchor:middle}.axis{stroke:#8c959f;stroke-width:1.5}.grid{stroke:#d8dee4;stroke-width:1;stroke-dasharray:4 5}.gcn{fill:none;stroke:#0969da;stroke-width:3}.gat{fill:none;stroke:#cf222e;stroke-width:3}.gcnPoint{fill:#0969da}.gatPoint{fill:#cf222e}.legend{font:14px Arial,sans-serif;fill:#24292f}</style></defs>
  <rect width="1200" height="520" rx="12" fill="#f6f8fa"/><rect class="bg" x="25" y="25" width="555" height="470" rx="8"/><rect class="bg" x="620" y="25" width="555" height="470" rx="8"/><text class="title" x="302" y="60">Mean pairwise cosine similarity ↑</text><text class="title" x="897" y="60">Normalized node dispersion ↓</text>
  <g><line class="axis" x1="90" y1="410" x2="540" y2="410"/><line class="axis" x1="90" y1="70" x2="90" y2="410"/><line class="grid" x1="90" y1="70" x2="540" y2="70"/><line class="grid" x1="90" y1="240" x2="540" y2="240"/><line class="grid" x1="90" y1="410" x2="540" y2="410"/><text class="label" x="52" y="75">1.0</text><text class="label" x="52" y="245">0.75</text><text class="label" x="52" y="415">0.5</text><g class="tick"><text x="105" y="434">1</text><text x="189" y="434">2</text><text x="273" y="434">3</text><text x="357" y="434">4</text><text x="441" y="434">5</text><text x="525" y="434">6</text></g><text class="label" x="315" y="463" text-anchor="middle">Layer</text><polyline class="gcn" points="105,372 189,243 273,215 357,196 441,147 525,196"/><polyline class="gat" points="105,332 189,127 273,138 357,107 441,104 525,115"/><g class="gcnPoint"><circle cx="105" cy="372" r="4"/><circle cx="189" cy="243" r="4"/><circle cx="273" cy="215" r="4"/><circle cx="357" cy="196" r="4"/><circle cx="441" cy="147" r="4"/><circle cx="525" cy="196" r="4"/></g><g class="gatPoint"><circle cx="105" cy="332" r="4"/><circle cx="189" cy="127" r="4"/><circle cx="273" cy="138" r="4"/><circle cx="357" cy="107" r="4"/><circle cx="441" cy="104" r="4"/><circle cx="525" cy="115" r="4"/></g></g>
  <g><line class="axis" x1="685" y1="410" x2="1135" y2="410"/><line class="axis" x1="685" y1="70" x2="685" y2="410"/><line class="grid" x1="685" y1="70" x2="1135" y2="70"/><line class="grid" x1="685" y1="240" x2="1135" y2="240"/><line class="grid" x1="685" y1="410" x2="1135" y2="410"/><text class="label" x="648" y="75">0.6</text><text class="label" x="648" y="245">0.3</text><text class="label" x="648" y="415">0.0</text><g class="tick"><text x="700" y="434">1</text><text x="784" y="434">2</text><text x="868" y="434">3</text><text x="952" y="434">4</text><text x="1036" y="434">5</text><text x="1120" y="434">6</text></g><text class="label" x="910" y="463" text-anchor="middle">Layer</text><polyline class="gcn" points="700,114 784,224 868,241 952,256 1036,273 1120,260"/><polyline class="gat" points="700,160 784,353 868,348 952,377 1036,378 1120,369"/><g class="gcnPoint"><circle cx="700" cy="114" r="4"/><circle cx="784" cy="224" r="4"/><circle cx="868" cy="241" r="4"/><circle cx="952" cy="256" r="4"/><circle cx="1036" cy="273" r="4"/><circle cx="1120" cy="260" r="4"/></g><g class="gatPoint"><circle cx="700" cy="160" r="4"/><circle cx="784" cy="353" r="4"/><circle cx="868" cy="348" r="4"/><circle cx="952" cy="377" r="4"/><circle cx="1036" cy="378" r="4"/><circle cx="1120" cy="369" r="4"/></g></g>
  <line class="gcn" x1="482" y1="475" x2="515" y2="475"/><text class="legend" x="522" y="480">GCN</text><line class="gat" x1="557" y1="475" x2="590" y2="475"/><text class="legend" x="597" y="480">GAT</text>
</svg>
