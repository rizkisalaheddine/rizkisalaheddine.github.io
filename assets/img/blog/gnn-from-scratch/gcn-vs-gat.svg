<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Comparison of GCN degree weights and GAT learned attention weights</title>
  <desc id="desc">Two neighborhood aggregation diagrams share the same topology but use different edge coefficients.</desc>
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#57606a"/></marker><marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0969da"/></marker>
    <style>.panel{fill:#fff;stroke:#d0d7de;stroke-width:1.5}.head{font:600 22px Georgia,serif;fill:#24292f;text-anchor:middle}.sub{font:15px Arial,sans-serif;fill:#57606a;text-anchor:middle}.mono{font:15px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#24292f;text-anchor:middle}.node{fill:#f6f8fa;stroke:#57606a;stroke-width:1.7}.target{fill:#ddf4ff;stroke:#0969da;stroke-width:2.5}.nt{font:600 16px Arial,sans-serif;fill:#24292f;text-anchor:middle;dominant-baseline:middle}.coef{font:13px Arial,sans-serif;fill:#57606a}.blue{fill:#0550ae}</style>
  </defs>
  <rect width="1200" height="470" rx="12" fill="#f6f8fa"/><rect class="panel" x="25" y="25" width="555" height="420" rx="8"/><rect class="panel" x="620" y="25" width="555" height="420" rx="8"/>
  <text class="head" x="302" y="62">Graph Convolutional Network</text><text class="sub" x="302" y="88">coefficients fixed by graph degrees</text>
  <line x1="175" y1="165" x2="279" y2="235" stroke="#57606a" stroke-width="3" marker-end="url(#arrowGray)"/><line x1="165" y1="300" x2="273" y2="263" stroke="#57606a" stroke-width="2" marker-end="url(#arrowGray)"/><line x1="405" y1="170" x2="325" y2="234" stroke="#57606a" stroke-width="4" marker-end="url(#arrowGray)"/><path d="M302 218C345 175 351 295 326 276" fill="none" stroke="#57606a" stroke-width="2.5" marker-end="url(#arrowGray)"/>
  <circle class="node" cx="155" cy="150" r="29"/><text class="nt" x="155" y="150">j₁</text><circle class="node" cx="145" cy="310" r="29"/><text class="nt" x="145" y="310">j₂</text><circle class="node" cx="430" cy="150" r="29"/><text class="nt" x="430" y="150">j₃</text><circle class="target" cx="302" cy="255" r="36"/><text class="nt" x="302" y="255">i</text>
  <text class="coef" x="194" y="201">0.29</text><text class="coef" x="196" y="287">0.20</text><text class="coef" x="373" y="205">0.41</text><text class="coef" x="353" y="287">0.25</text><text class="mono" x="302" y="370">cⱼᵢ = 1 / √(d̃ᵢ d̃ⱼ)</text><text class="sub" x="302" y="404">same rule for every input feature configuration</text>
  <text class="head" x="897" y="62">Graph Attention Network</text><text class="sub" x="897" y="88">coefficients learned from endpoint states</text>
  <line x1="770" y1="165" x2="874" y2="235" stroke="#0969da" stroke-width="5.5" marker-end="url(#arrowBlue)"/><line x1="760" y1="300" x2="868" y2="263" stroke="#0969da" stroke-width="1.5" marker-end="url(#arrowBlue)"/><line x1="1000" y1="170" x2="920" y2="234" stroke="#0969da" stroke-width="3" marker-end="url(#arrowBlue)"/><path d="M897 218C940 175 946 295 921 276" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <circle class="node" cx="750" cy="150" r="29"/><text class="nt" x="750" y="150">j₁</text><circle class="node" cx="740" cy="310" r="29"/><text class="nt" x="740" y="310">j₂</text><circle class="node" cx="1025" cy="150" r="29"/><text class="nt" x="1025" y="150">j₃</text><circle class="target" cx="897" cy="255" r="36"/><text class="nt" x="897" y="255">i</text>
  <text class="coef blue" x="789" y="201">α = 0.52</text><text class="coef blue" x="786" y="287">0.08</text><text class="coef blue" x="960" y="205">0.27</text><text class="coef blue" x="948" y="287">0.13</text><text class="mono" x="897" y="370">αⱼᵢ = softmaxⱼ(eⱼᵢ)</text><text class="sub" x="897" y="404">normalized over edges entering destination i</text>
</svg>
