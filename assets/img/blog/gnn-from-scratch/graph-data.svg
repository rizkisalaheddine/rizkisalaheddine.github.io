<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Graph structure represented as a drawing, adjacency matrix, and COO edge list</title>
  <desc id="desc">An attributed four-node graph and two equivalent numerical representations.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#57606a"/></marker>
    <style>.panel{fill:#fff;stroke:#d0d7de;stroke-width:1.5}.heading{font:600 20px Georgia,serif;fill:#24292f}.label{font:15px Arial,sans-serif;fill:#57606a}.mono{font:15px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#24292f}.edge{stroke:#57606a;stroke-width:2;fill:none;marker-end:url(#arrow)}.node{fill:#ddf4ff;stroke:#0969da;stroke-width:2}.nodeText{font:600 16px Arial,sans-serif;fill:#0550ae;text-anchor:middle;dominant-baseline:middle}.cell{fill:#f6f8fa;stroke:#d8dee4}.one{fill:#ddf4ff;stroke:#54aeff}.small{font:13px Arial,sans-serif;fill:#57606a}</style>
  </defs>
  <rect width="1200" height="430" fill="#f6f8fa" rx="12"/>
  <rect class="panel" x="20" y="20" width="370" height="390" rx="8"/><rect class="panel" x="415" y="20" width="370" height="390" rx="8"/><rect class="panel" x="810" y="20" width="370" height="390" rx="8"/>
  <text class="heading" x="205" y="55" text-anchor="middle">Attributed graph</text>
  <path class="edge" d="M145 135C190 92 236 92 273 130"/><path class="edge" d="M270 150C225 190 180 190 143 152"/><path class="edge" d="M180 278C145 250 128 218 132 165"/><path class="edge" d="M198 286C242 303 278 284 302 250"/><path class="edge" d="M302 255C270 320 235 330 208 310"/>
  <circle class="node" cx="128" cy="145" r="28"/><text class="nodeText" x="128" y="145">v₀</text><circle class="node" cx="286" cy="145" r="28"/><text class="nodeText" x="286" y="145">v₁</text><circle class="node" cx="190" cy="300" r="28"/><text class="nodeText" x="190" y="300">v₂</text><circle class="node" cx="315" cy="238" r="28"/><text class="nodeText" x="315" y="238">v₃</text>
  <rect x="55" y="340" width="300" height="45" rx="5" fill="#fff8c5" stroke="#d4a72c"/><text class="mono" x="70" y="368">X ∈ ℝ⁴ˣ²,   xᵢ = node features</text>
  <text class="heading" x="600" y="55" text-anchor="middle">Adjacency matrix A</text><text class="small" x="600" y="82" text-anchor="middle">rows: destination i · columns: source j</text>
  <g transform="translate(490 110)">
    <text class="mono" x="55" y="-10">0</text><text class="mono" x="105" y="-10">1</text><text class="mono" x="155" y="-10">2</text><text class="mono" x="205" y="-10">3</text><text class="mono" x="10" y="34">0</text><text class="mono" x="10" y="84">1</text><text class="mono" x="10" y="134">2</text><text class="mono" x="10" y="184">3</text>
    <rect class="cell" x="35" y="0" width="45" height="45"/><rect class="one" x="85" y="0" width="45" height="45"/><rect class="one" x="135" y="0" width="45" height="45"/><rect class="cell" x="185" y="0" width="45" height="45"/><rect class="one" x="35" y="50" width="45" height="45"/><rect class="cell" x="85" y="50" width="45" height="45"/><rect class="cell" x="135" y="50" width="45" height="45"/><rect class="cell" x="185" y="50" width="45" height="45"/><rect class="cell" x="35" y="100" width="45" height="45"/><rect class="cell" x="85" y="100" width="45" height="45"/><rect class="cell" x="135" y="100" width="45" height="45"/><rect class="one" x="185" y="100" width="45" height="45"/><rect class="cell" x="35" y="150" width="45" height="45"/><rect class="cell" x="85" y="150" width="45" height="45"/><rect class="one" x="135" y="150" width="45" height="45"/><rect class="cell" x="185" y="150" width="45" height="45"/>
    <g class="mono" text-anchor="middle"><text x="57" y="29">0</text><text x="107" y="29">1</text><text x="157" y="29">1</text><text x="207" y="29">0</text><text x="57" y="79">1</text><text x="107" y="79">0</text><text x="157" y="79">0</text><text x="207" y="79">0</text><text x="57" y="129">0</text><text x="107" y="129">0</text><text x="157" y="129">0</text><text x="207" y="129">1</text><text x="57" y="179">0</text><text x="107" y="179">0</text><text x="157" y="179">1</text><text x="207" y="179">0</text></g>
  </g>
  <text class="label" x="600" y="350" text-anchor="middle">Storage: O(N²)</text><text class="small" x="600" y="378" text-anchor="middle">Useful notation; inefficient for sparse graphs</text>
  <text class="heading" x="995" y="55" text-anchor="middle">COO edge representation</text><text class="small" x="995" y="82" text-anchor="middle">one aligned source-destination pair per edge</text>
  <rect x="855" y="115" width="280" height="135" rx="7" fill="#f6f8fa" stroke="#d0d7de"/><text class="mono" x="880" y="150">src = [0, 1, 2, 2, 3]</text><text class="mono" x="880" y="190">dst = [1, 0, 0, 3, 2]</text><path d="M928 206H1095" stroke="#0969da" stroke-width="2"/><text class="small" x="995" y="232" text-anchor="middle">edge r: src[r] → dst[r]</text>
  <text class="label" x="995" y="300" text-anchor="middle">Storage: O(|E|)</text><rect x="860" y="330" width="270" height="48" rx="5" fill="#ddf4ff" stroke="#54aeff"/><text class="mono" x="880" y="359">x[src]  →  edge features</text>
</svg>
